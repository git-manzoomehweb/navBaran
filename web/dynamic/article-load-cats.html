<basis
  core="dbsource"
  source="basiscore"
  lid="1"
  mid="1"
  name="db"
  catid="[##cms.query.catid##]"
>
  <member
    name="article-list"
    type="list"
    link="article.bc"
    propertyid="7244,7248"
    perpage="9"
    pageno="[##cms.query.pagenum|(1)##]"
    order="ord"
    size="283x177"
  />
  <member
    name="paging"
    type="list"
    request="paging"
    count="2"
    parentname="article-list"
  />
</basis>

<basis core="list" datamembername="db.article-list">
  <else-layout>
    <div class="w-full flex flex-col mt-20 gap-10 justify-center items-center">
      <p class="text-base text-primary-900">موردی یافت نشد .</p>
      <a
        class="w-fit hover:scale-105 p-3 bg-primary-900 rounded-lg h-16 flex justify-center items-center text-white text-sm"
        href="/"
      >
        بازگشت به صفحه اصلی
      </a>
    </div>
  </else-layout>
  <layout>
    <div class="w-full grid grid-cols-4 gap-3">@child</div>
  </layout>
  <face filter="link is null">
    <a
      href="/article.bc?lid=1&id=@id"
      class="bg-white flex flex-col justify-between hover:bg-primary-100 hover:border-primary-500 border border-zinc-300 rounded-3xl h-[300px] p-2"
    >
      <img
        loading="lazy"
        class="w-full rounded-[28px] h-[177px]"
        src="@00283X00177prp"
        alt="@title"
        height="177"
        width="283"
      />
      <p class="font-bold line-clamp-1">@title</p>
      <p class="text-zinc-700 text-sm line-clamp-3">@prp_7244</p>
    </a>
  </face>
  <face>
    <a
      href="@link"
      class="bg-white flex flex-col justify-between hover:bg-primary-100 hover:border-primary-500 border border-zinc-300 rounded-3xl h-[300px] p-2"
    >
      <img
        loading="lazy"
        class="w-full rounded-[28px] h-[177px]"
        src="@00283X00177prp"
        alt="@title"
        height="177"
        width="283"
      />
      <p class="font-bold line-clamp-1">@title</p>
      <p class="text-zinc-700 text-sm line-clamp-3">@prp_7244</p>
    </a>
  </face>
</basis>

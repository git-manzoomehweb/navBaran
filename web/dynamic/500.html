<!DOCTYPE html>
<html dir="rtl" lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0,shrink-to-fit=no,viewport-fit=cover"
    />
    <title>
      [##cms.seo.title|(شرکت خدمات مسافرت هوایی و گردشگری ناوبران)##]
    </title>
    <meta
      name="description"
      content="[##cms.seo.description|(شرکت خدمات مسافرت هوایی و گردشگری  ناوبران)##]"
    />
    <meta name="robots" content="noindex, nofollow" />
    <basis
      core="dbsource"
      source="hosting"
      name="tag"
      urlid="[##cms.seo.urlid##]"
    >
      <member type="list" name="list" request="taglist" preview=""></member>
    </basis>
    <basis core="print" datamembername="tag.list">
      <face filter="key = 'canonical'">
        <link rel="canonical" href="@value" />
      </face>
      <face>
        <meta property="@key" content="@value" />
      </face>
    </basis>
    <basis core="call" file="pwa.inc" />
    <basis core="call" file="style.inc" />
    <link
      rel="stylesheet"
      href="[##cms.cms.cdn##]/_css/swiper-bundle.min.css"
    />
  </head>
  <body class="relative">
    <basis core="call" file="header.inc" />
    <main class="my-24 flex justify-center w-full items-center flex-col gap-4">
      <img
        class="w-[500px] h-[405px]"
        width="1000"
        height="811"
        src="[##cms.cms.cdn##]/images/500.png"
        alt="500"
      />
      <h1>ارتباط با سرور با مشکل مواجه شد</h1>
      <a
        href="/"
        class="rounded-lg px-4 py-3 bg-primary-900 text-white hover:bg-secondary"
        >بازگشت به صفحه اصلی</a
      >
    </main>

    <basis core="call" file="footer.inc" />
  </body>
</html>
